name: Daily Price & Transaction Tracker

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install requests python-dotenv

      - name: Track prices (all catalog + open orders)
        env:
          GW2_KEY: ${{ secrets.GW2_KEY }}
        run: python track_prices.py

      - name: Fetch sell history (fill-time data for Weibull models)
        env:
          GW2_KEY: ${{ secrets.GW2_KEY }}
        run: python fetch_transaction_history.py

      - name: Commit updated data
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add tp.sqlite data/
          git diff --cached --quiet || git commit -m "[bot] daily price + transaction snapshot"
          git push
